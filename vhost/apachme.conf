# this is all the wsbc stuff
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so

ServerName localhost
Include /httpd/waluigi_servebeer/vhost/wsbc.conf

# and this is some non-wsbc stuff :^)
Alias "/cmpe" "/httpd/cmpe"
<Directory "/httpd/cmpe">
  AllowOverride None
  Options Indexes FollowSymLinks
  Require all granted
</Directory>
Alias "/nonce" "/httpd/nonce"
<Directory "/httpd/nonce">
  AllowOverride None
  Options Indexes FollowSymLinks
  Require all granted
</Directory>
