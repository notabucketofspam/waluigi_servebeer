DocumentRoot "/httpd/waluigi_servebeer/html"
Header add Cache-Control max-age=3939

<Directory "/httpd/waluigi_servebeer">
  AllowOverride None
  Require all granted
</Directory>
<Directory "/httpd/waluigi_servebeer/html">
  AllowOverride None
  Options Indexes FollowSymLinks
  Require all granted
</Directory>
<Directory "/httpd/waluigi_servebeer/cgi-bin">
  AllowOverride None
  Options None
  Require all granted
</Directory>
ScriptAlias /cgi-bin/ "/httpd/waluigi_servebeer/cgi-bin/"

# ClockBot
Include "/httpd/clockbot/vhost/clockbot.conf"

# online
Include "/httpd/online/vhost/online.conf"

Alias "/dlc" "/httpd/dlc"
<Directory "/httpd/dlc">
  AllowOverride none
  Options indexes
  Require all granted
  FileETag Digest
</Directory>

# Shinonome-posting
AliasMatch "^/.well-known" "/httpd/waluigi_servebeer/html/resource/wkbs.jpg"
